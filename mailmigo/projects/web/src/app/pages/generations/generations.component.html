<section class="mt-8 w-full">
  <button
    pButton
    pRipple
    class="mb-8 font-normal"
    (click)="showFilterDialog()"
    icon="pi pi-filter"
    label="Add Filter"
  ></button>
  <p-toast></p-toast>

  <div class="flex w-[80%] max-w-[1100px] flex-col">
    <p-table class="w-full" [value]="records()">
      <ng-template pTemplate="header">
        <tr>
          <th>Generation Type</th>
          <th>Title</th>
          <th>Status</th>
          <!-- <th>Date</th> -->
          <th>Download</th>
          <th>Open</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-record>
        <tr>
          <td>{{ record.type }}</td>
          <td>{{ record.id }}</td>
          <td>{{ record.status }}</td>
          <!-- <td>{{ record.timestamp }}</td> -->
          <td>
            <button
              pButton
              icon="pi pi-download"
              (click)="download(record)"
              class="p-button-rounded m-auto"
            ></button>
          </td>
          <td>
            <button
              pButton
              icon="pi pi-file"
              (click)="open(record)"
              class="p-button-rounded"
            ></button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</section>
