<div class = "flex items-center justify-center h-screen ">
    <app-logo></app-logo>

    <div *ngIf="!isSubmitting" class = "text-center w-80 pb-24">
        <p class = "text-2xl font-medium">Create an account</p>
        <p class = "font-light mt-1.5">Enter your email to get started!</p>
        <form action="/login" method="POST">
            <input #userFullName required type="text" class="rounded-md border border-grey-500 mt-4 w-full placeholder:text-slate-400 pl-[8px] h-8" name="userFullName" placeholder="Full Name"/>
            <input #userEmail required type="email" class="rounded-md border border-grey-500 mt-4 w-full placeholder:text-slate-400 pl-[8px] h-8" name="userEmail" placeholder="email@domain.com"/>
            <input #userPass required type="password" class="rounded-md border border-grey-500 mt-4 w-full placeholder:text-slate-400 pl-[8px] h-8" name="userPass" placeholder="Password"/>
            <button #submitForEmail type="button" (click) = "loginWithEmail(userFullName.value, userEmail.value, userPass.value)" class="bg-black shadow-md text-white text-sm rounded-md border border-grey-500 mt-4 w-full h-8">Sign up with email</button>
        </form>
        <div class="flex items-center mt-5">
            <div class="flex-grow border-t border-gray-300"></div>
            <span class="px-1 text-gray-400 text-sm">or continue with</span>
            <div class="flex-grow border-t border-gray-300"></div>
        </div>
        <button #submitForGoogle (click) = "loginWithGoogle()" class="bg-zinc-100 hover:bg-zinc-200 hover:border-zinc-200 shadow-md block rounded-md border border-zinc-100 mt-4 w-full h-7 px-4 pt-1 pb-8">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="inline float-left w-5 h-5 mt-1">
            <span class="inline">Google</span>
        </button>
        <p class="items-center mt-5 text-gray-400 text-sm"> By clicking continue, you agree to our <a href="#" class="text-black">Terms of Service</a> and <a href="#" class="text-black">Privacy Policy</a> </p>
    </div>
    
    <div *ngIf="isSubmitting">
        <p-progressSpinner ariaLabel="loading" />
    </div>
</div>
