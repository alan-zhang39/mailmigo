<div class="flex w-10/12 flex-col items-center">
  <table
    class="ml-0 mt-8 w-full table-fixed border-collapse text-left text-base"
  >
    <thead>
      <tr class="[&>*]:font-normal">
        <th class="text-grey-600 pb-4 pt-4">File</th>
        <th class="">Uploaded</th>
        <th class="text-center">Chat with Document</th>
        <th class="text-center">Preview Document</th>
        <th class="text-center">Delete</th>
      </tr>
    </thead>

    <tbody>
      <tr
        class="border-grey-100 border-0 border-t-2 border-solid text-sm"
        *ngFor="let doc of this.documents()"
      >
        <td class="text-grey-600 pb-4 pt-4">{{ doc.filename }}</td>
        <td>{{ doc.timestamp }}</td>
        <td class="text-center">TODO: (+)</td>
        <td class="text-center">
          <button (click)="previewDocument(doc)">></button>
        </td>
        <td class="text-center">
          <button>-</button>
          <!-- <button (click)="this.documentsService.deleteDocument(doc.id)">-</button> -->
        </td>
      </tr>
      <tr></tr>
    </tbody>
  </table>
</div>
