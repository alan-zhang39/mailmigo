<div class="p-fluid">
    <div class="p-field mb-6">
        <label class="mb-4" for="newPass">New Password</label>
        <input #NewPass required type="password" class="rounded-md border border-grey-500 mt-4 w-full placeholder:text-slate-400 pl-[8px] h-8" name="newPass" placeholder="Enter a New Password"/>
    </div>
    <div class="p-field mb-6">
        <label class="mb-4" for="confirmPass">Confirm New Password</label>
        <input #ConfirmPass required type="password" class="rounded-md border border-grey-500 mt-4 w-full placeholder:text-slate-400 pl-[8px] h-8" name="confirmPass" placeholder="Confirm Password"/>
    </div>
    <p-confirmPopup />
    <button class="bg-black shadow-md text-white text-sm font-semibold rounded-md border border-grey-500 w-1/3 h-10" (click)="confirm($event, NewPass.value, ConfirmPass.value)" >Reset</button>
  </div>
