<div class="flex h-screen items-center justify-center">
  <app-logo></app-logo>

  <div *ngIf="!isSubmitting" class="w-80 pb-24 text-center">
    <p class="text-2xl font-medium">Sign In</p>
    <form action="/login" method="POST">
      <input
        #userEmail
        required
        type="email"
        class="border-grey-500 mt-4 h-8 w-full rounded-md border pl-[8px] placeholder:text-slate-400"
        name="userEmail"
        placeholder="email@domain.com"
      />
      <input
        #userPass
        required
        type="password"
        class="border-grey-500 mt-4 h-8 w-full rounded-md border pl-[8px] placeholder:text-slate-400"
        name="userPass"
        placeholder="Password"
      />
      <button
        #submitForEmail
        type="button"
        (click)="loginWithEmail(userEmail.value, userPass.value)"
        class="border-grey-500 mt-4 h-8 w-full rounded-md border bg-black text-sm font-semibold text-white shadow-md"
      >
        Sign in
      </button>
    </form>
    <div class="mt-5 flex items-center">
      <div class="flex-grow border-t border-gray-300"></div>
      <span class="px-1 text-sm text-gray-400">or continue with</span>
      <div class="flex-grow border-t border-gray-300"></div>
    </div>
    <button
      #submitForGoogle
      (click)="loginWithGoogle()"
      class="mt-4 block h-7 w-full rounded-md border border-zinc-100 bg-zinc-100 px-4 pb-8 pt-1 shadow-md hover:border-zinc-200 hover:bg-zinc-200"
    >
      <img
        src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
        alt="Google"
        class="float-left mt-1 inline h-5 w-5"
      />
      <span class="mr-7 mt-1.5 inline-block font-semibold">Google</span>
    </button>
    <p class="mt-5 items-center text-sm text-gray-400">
      By clicking continue, you agree to our
      <a href="#" class="text-black">Terms of Service</a> and
      <a href="#" class="text-black">Privacy Policy</a>
    </p>
  </div>

  <div *ngIf="isSubmitting">
    <p-progressSpinner ariaLabel="loading" />
  </div>
</div>
