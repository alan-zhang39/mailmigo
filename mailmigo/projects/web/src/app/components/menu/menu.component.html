<div class = 'flex fixed justify-start w-[14.5vw]'>
  <div class='relative text-wrap overflow-hidden'>
      <nav class="left-0 h-screen border border-grey-500 pt-14 w-[14.5vw]">
          <app-logo class="pb-20"></app-logo>
          <p-menu [model]="items" styleClass = 'border-none w-[14vw]'>
              <ng-template pTemplate="item" let-item>
                  <ng-container *ngIf="item.route; else elseBlock">
                      <a [routerLink]="item.route" class="p-menuitem-link">
                          <span [class]="item.icon"></span>
                          <span class="ml-2">{{ item.label }}</span>
                      </a>
                  </ng-container>
                  <ng-template #elseBlock>
                      <div class="p-menuitem-link">
                          <span [class]="item.icon"></span>
                          <span class="ml-2">{{ item.label }}</span>
                      </div>
                  </ng-template>
              </ng-template>
          </p-menu>
      </nav>
  </div>
</div>
<div class = 'flex justify-start w-[14.5vw]'></div>
