<div class="flex flex-col w-screen h-screen justify-center items-center gap-10">
  <p>
    Current count with loading message:
    {{
      this.countService.count() === undefined
        ? "Fetching Count..."
        : this.countService.count()
    }}
  </p>

  <p>
    Current count with initial value:
    {{ this.countService.countWithInitial() }}
  </p>

  <button
    class="border-2 border-black px-10 py-5 text-xl rounded-xl"
    (click)="this.countService.addToCount()"
  >
    Add to count
  </button>
</div>
